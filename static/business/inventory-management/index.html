<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Browser-based inventory management demo."
        />
        <title>Inventory Management Demo</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>

    <body>
        <main>
            <header>
                <h1>Inventory Resource Planner</h1>
                <p>Demo to manage sample products</p>
            </header>

            <section aria-labelledby="inventory-heading">
                <header>
                    <h2 id="inventory-heading">Inventory Records</h2>

                    <button type="button" id="reset-button">
                        Reset Demo Inventory
                    </button>
                </header>

                <p id="inventory-count" aria-live="polite">0 products</p>

                <p id="empty-message" hidden>No products found.</p>

                <div>
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Product</th>
                                <th scope="col">Quantity</th>
                                <th scope="col">Unit Cost</th>
                                <th scope="col">Selling Price</th>
                                <th scope="col">Last Updated</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>

                        <tbody id="inventory-table-body">
                            <!-- Products rendered by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>

            <section aria-labelledby="inventory-form-heading">
                <h2 id="inventory-form-heading">Add Product</h2>

                <form id="product-form">
                    <input type="hidden" id="product-id" readonly />

                    <div>
                        <label for="product-name">Product Name</label>
                        <input
                            type="text"
                            id="product-name"
                            name="product_name"
                            required
                        />
                    </div>

                    <div>
                        <label for="quantity">Quantity</label>
                        <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            min="0"
                            required
                        />
                    </div>
                    <div>
                        <label for="unit-cost">Unit Cost</label>
                        <input
                            type="number"
                            id="unit-cost"
                            name="unit_cost"
                            min="0"
                            step="0.01"
                            required
                        />
                    </div>

                    <div>
                        <label for="selling-price">Selling Price</label>
                        <input
                            type="number"
                            id="selling-price"
                            name="selling-price"
                            min="0"
                            step="0.01"
                            required
                        />
                    </div>

                    <div id="updated-at-container" hidden>
                        <span>Last Updated</span>
                        <time id="updated-at"></time>
                    </div>

                    <button type="submit" id="submit-button">
                        Add Product
                    </button>

                    <button type="button" id="cancel-button" hidden>
                        Cancel
                    </button>
                </form>
            </section>

            <footer>
                <p>
                    Demo does not provide a persistent db. Please contact us to
                    deliver the product.
                </p>
            </footer>
        </main>
        <script src="js/inventory-demo.js" defer></script>
    </body>
</html>
