<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="A simple number guessing game built with HTML, CSS, and JavaScript."
        />
        <title>Number Guessing Game</title>
        <link rel="stylesheet" href="css/styles.css" />
        <script src="js/script.js" defer></script>
    </head>
    <body>
        <main class="game">
            <header class="game-header">
                <h1>Number Guessing Game</h1>
                <p>Guess the number between 1 and 10.</p>
            </header>

            <section id="start-section">
                <form id="start-form">
                    <label for="player-name">Your name</label>
                    <input
                        type="text"
                        id="player-name"
                        name="player-name"
                        placeholder="Enter your name"
                        maxlength="30"
                        required
                    />
                    <button type="submit">Start Game</button>
                </form>
            </section>

            <section id="game-section" hidden>
                <h2 id="welcome-message"></h2>

                <form id="guess-form">
                    <label for="guess">Your guess</label>
                    <input
                        type="number"
                        id="guess"
                        name="guess"
                        min="1"
                        max="10"
                        placeholder="1–10"
                        required
                    />
                    <button id="guess-button" type="submit">Guess</button>
                </form>

                <p id="feedback" role="status" aria-live="polite">
                    Make your first guess!
                </p>

                <p>Attempts: <span id="attempts">0</span></p>

                <button type="button" id="restart-button" hidden>
                    Play Again
                </button>
            </section>

            <section id="scores-section" hidden>
                <h2>Highest Score</h2>
                <ul id="scores-list"></ul>
            </section>
        </main>
    </body>
</html>
