{% extends "layout.html" %} {% block content %}
<section class="mx-auto max-w-md px-6">
    <header class="mb-8">
        <h1 class="text-3xl font-bold">Reset Password</h1>
    </header>

    <section class="rounded-xl border border-green-900 bg-gray-950 p-8">
        {% if error %}
        <p class="mb-4 text-red-400">{{ error }}</p>
        {% endif %} {% if not error %}
        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="password" class="mb-2 block text-left">
                    New Password
                </label>
                <input type="password" name="password" id="password" autocomplete="new-password" required
                    class="w-full rounded-lg border border-green-900 bg-black px-4 py-3 text-green-400 outline-none focus:border-green-500" />
            </div>

            <div>
                <label for="confirm_password" class="mb-2 block text-left">
                    Confirm Password
                </label>
                <input type="password" name="confirm_password" id="confirm_password" autocomplete="new-password"
                    required
                    class="w-full rounded-lg border border-green-900 bg-black px-4 py-3 text-green-400 outline-none focus:border-green-500" />
            </div>

            <button type="submit"
                class="w-full rounded-lg border border-green-500 px-4 py-3 transition hover:bg-green-500 hover:text-black">
                Update Password
            </button>
        </form>
        {% else %}
        <a href="{{ url_for('forgot_password') }}" class="text-green-500 hover:text-green-200">
            Request another reset link
        </a>
        {% endif %}
    </section>
</section>
{% endblock %}
