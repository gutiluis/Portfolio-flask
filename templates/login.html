{% extends 'layout.html' %}

{% block content %}
<section class="mx-auto max-w-md px-6">

    <header class="mb-8">
        <h1 class="text-3xl font-bold">Login</h1>
    </header>

    <section id="form" class="rounded-xl border border-green-900 bg-gray-950 p-8">

        {% if error %}
        <p class="mb-4 text-red-400">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="username" class="mb-2 block text-left">
                    Username or Email Address
                </label>
                <input type="text" name="username" id="username" autocomplete="username" required
                    class="w-full rounded-lg border border-green-900 bg-black px-4 py-3 text-green-400 outline-none focus:border-green-500">
            </div>

            <div>
                <label for="password" class="mb-2 block text-left">
                    Password
                </label>
                <input type="password" name="password" id="password" autocomplete="current-password" required
                    class="w-full rounded-lg border border-green-900 bg-black px-4 py-3 text-green-400 outline-none focus:border-green-500">
            </div>
            <div class="text-right">
                <a href="{{ url_for('forgot_password') }}"
                    class="text-sm text-green-500 transition-colors hover:text-green-200">
                    Forgot Password?
                </a>
            </div>

            <button type="submit"
                class="w-full rounded-lg border border-green-500 px-4 py-3 transition hover:bg-green-500 hover:text-black">
                Log In
            </button>

        </form>
    </section>
</section>
{% endblock %}
