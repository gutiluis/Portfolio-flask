{% extends 'layout.html' %}

{% block content %}
    <section class="header">
        <h1>Owner Login</h1>
    </section>

    <section id="form">
        {% if error %}
            <p>{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <label for="username">Username</label>
            <input
                type="text"
                name="username"
                id="username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                name="password"
                id="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Log In</button>
        </form>
    </section>
{% endblock %}
