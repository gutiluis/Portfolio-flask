{% extends "layout.html" %} {% block content %}
<section class="mx-auto max-w-md px-6">
    <header class="mb-8">
        <h1 class="text-3xl font-bold">Forgot Password</h1>
        <p class="mt-3 text-green-500">
            Enter your account email to receive a reset link.
        </p>
    </header>

    <section class="rounded-xl border border-green-900 bg-gray-950 p-8">
        {% if message %}
        <p class="mb-4 text-green-400">{{ message }}</p>
        {% endif %}

        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="email" class="mb-2 block text-left"> Email </label>
                <input type="email" name="email" id="email" autocomplete="email" required
                    class="w-full rounded-lg border border-green-900 bg-black px-4 py-3 text-green-400 outline-none focus:border-green-500" />
            </div>

            <button type="submit"
                class="w-full rounded-lg border border-green-500 px-4 py-3 transition hover:bg-green-500 hover:text-black">
                Send Reset Link
            </button>
        </form>

        <a href="{{ url_for('login') }}" class="mt-6 block text-sm text-green-500 hover:text-green-200">
            Back to Login
        </a>
    </section>
</section>
{% endblock %}
