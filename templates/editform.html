{% extends 'layout.html' %}

{% block content %}
<section class="header">
    <h1>Edit Project</h1>
</section>
<section id="form">
    <form action="{{ url_for('project_edit', project_id=project.id) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="title">Project Title</label>
        <input type="text" name="title" id="title"
            class="block w-full border border-green-400 bg-black p-3 text-green-400" placeholder="Project Name"
            value="{{ project.title }}" required>

        <label for="date">Completion Date</label>
        <input type="month" name="date" id="date"
            class="block w-full border border-green-400 bg-black p-3 text-green-400" placeholder="YYYY-MM"
            value="{{ project.created.strftime('%Y-%m') }}" required>

        <label for="description">Description</label>
        <textarea name="desc" id="description" rows="20"
            class="block w-full border border-green-400 bg-black p-3 text-green-400" placeholder="Description"
            required>{{ project.description }}</textarea>

        <label for="technologies-list" id="technologies-label">Technologies</label>
        <p>Separate each technology by a comma</p>
        <textarea name="technologies" id="technologies-list" rows="10"
            class="block w-full border border-green-400 bg-black p-3 text-green-400"
            placeholder="Technology, Technology" required>{{ project.technologies }}</textarea>

        <label for="github">GitHub Link</label>
        <input type="url" name="github" id="github"
            class="block w-full border border-green-400 bg-black p-3 text-green-400" placeholder="Link to the repo"
            value="{{ project.github_repo }}">

        <div>
            <button type="reset">Cancel</button>
            <button type="submit">Submit</button>
        </div>
    </form>
</section>
{% endblock %}
